<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/img/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CDL — Community Development Lab. The ROSEdu course where you make your first contribution to an open source project." />
    <meta property="og:title" content="CDL — Community Development Lab" />
    <meta property="og:description" content="Workshops on Git, GitHub and Docker, followed by hackathons on real open source projects." />
    <meta property="og:type" content="website" />
    <title>CDL — Community Development Lab</title>
  </head>
  <body>
    <script>
      // Set the theme before first paint, so the page never flashes the wrong one.
      (function () {
        try {
          var stored = localStorage.getItem("cdl-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
